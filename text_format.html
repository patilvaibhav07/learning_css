<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_transfotm_uppercase {
            text-transform: uppercase;
        }

        .t_transform_lowercase {
            text-transform: lowercase;
        }

        .t_transform_capitilize {
            text-transform: capitalize;
        }

        .t_decor_underline {
            text-decoration: underline;
        }

        .t_decor_overline {
            text-decoration: overline;
        }

        .t_decor_lineThrough {
            text-decoration: line-through;
        }

        .t_decor_all {
            text-decoration: underline overline line-through;
        }

        .t_align_r {
            text-align: right;
        }

        .t_align_c {
            text-align: center;
        }
        .t_align_l{
            text-align: left;
        }
        .t_shadow{
          font-size: 90px; 
            color:blue;
            text-shadow: 5px 7px 6px red;
        }
    </style>
</head>

<body>
    <h1 class="t_shadow t-align_c">Vaibhav</h1>
     <h1 class="t_align_l">Hello Navjit and Om</h1>
    <h1 class="t_align_r">Hello Navjit and Om</h1>
    <h1 class="t_align_c">Hello Navjit and Om</h1>
    <h1 class="t_decor_all">vaibhav</h1>
    <h1 class="t_decor_underline">Hello Welcome Ayush</h1>
    <h1 class="t_decor_overline">Hello Welcome Ayush</h1>
    <h1 class="t_decor_lineThrough">Hello Welcome Ayush</h1>
    <h1 class="t_transform_uppercase">This is Example fo rText
        formatting</h1>
    <h1 class="t_transform_lowercase">This is Example fo rText
        formatting</h1>
    <h1 class="t_transform_capitilize">This is Example fo rText
        formatting</h1>
</body>

</html>
