<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b_property1 {
            border: 25px solid red;
            height: 500px;
        }

        .b_property2 {
            border: 25px dotted blue;

        }

        .b_property3 {
            border: 25px dashed yellow;
        }

        .b_property4 {
            border: 25px inset green;
        }

        .b_property5 {
            border: 25px outset orange;
        }

        .b_property6 {
            border: 15px solid blue;
            border-top-color: green;
            border-right-color: blueviolet;
            border-bottom-color: green;
            border-left-color: blueviolet;
            border-radius: 50px 140px 20px 100px;
        }
    </style>
</head>

<body>
    <img src="images/swami_samarth_wallpaper.jpg" class="b_property1" />
    <img src="images/rose flower.jpeg" class="b_property2" />
    <img src="images/indian flag image.png" class="b_property3" />
    <img src="images/krishna image.png" class="b_property4" />
    <img src="images/tiger image.jpeg" class="b_property5" />
    <img src="images/Deer image.jpeg" class="b_property6" />
</body>

</html>
