<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
            margin: 50px;
        }
        div {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
        }

        .blue {
            background-color: blue;
            left: 40px;
            z-index: 11;
        }

        .red {
            background-color: red;
            left: 80px;
            z-index: 15;
        }
         .black {
            background-color: black;
            left: 120px;
            z-index: 14;
        }
    </style>
</head>
<body>
      <div class="container">
        <div class="blue"></div>
        <div class="red"></div>
        <div class="black"></div>
      </div>    
</body>
</html>
