<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_shadow {
            text-shadow: 2px 7px 8px red;
            color: blue;
            font-size: 70px;
            text-align: center;
        }

        .b_shadow {
            width: 300px;
            box-shadow: 6px 7px 8px blue;
        }

        .b_shadow2 {
            width: 400px;
            height: 250px;
            box-shadow: 9px 10px 20px red;
        }

        .d_shadow {
            width: 500px;
            filter: drop-shadow(5px 6px 7px blue);
        }
    </style>
</head>

<body>
    <img src="images/krishna image.png" class="d_shadow" />
    <img src="images/indian flag image.png" class="d_shadow" />
    <h1 class="t_shadow">vaibhav</h1>
    <img src="images/JCB image.jpeg" alt="construction" class="d_shadow" />
    <img src="images/tiger image.jpeg" alt="animal" class="b_shadow2" />
</body>

</html>
