<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 150px;
            border: 4px solid black;
            margin-bottom: 10px;
            padding: 20px;
            background-color: aqua;
        }
        .box1{
            position: static;
        }
        .box2{
            position: relative;
            left: 300px;
            top: 30px;
        }
        .box3{
            position: absolute;
            left: 300px;
            top: 20px;
        }
        .box4{
            position: sticky;
            top: 10px;
            
        }
        .box5{
            position: fixed;
            right: 10px;
            bottom: 0px;
        }
        
        
    </style>
</head>

<body>
    <!--div.box*5-->
    <div class="box box1">static</div>
    <div class="box box2">Relative</div>
    <div class="box box3">Absolute</div>
    <div class="box box4">Sticky</div>
    <div class="box box5">Fixed</div>
    <img src="images/tiger image.jpeg" class="b_image"/>
    <img src="images/JCB image.jpeg" class="b_image"/>
</body>

</html>
